schema_version = "1.4"
artifacts = [ "/app",]

[task]
name = "repo/csv-parser-to-rust"
description = "Streaming csv parser inspired by binary-csv that aims to be faster than everyone else\n\nThe selected workload contains 16 scenario(s). Commands exercised: /app/run.sh. Input fixtures: inputs.tar.gz. Preserve exit status, standard output/error, and produced files for these repository-owned cases."
authors = []
keywords = [ "repo", "cross-language",]

[metadata]
scale = "repo"
source_language = "javascript"
target_language = "rust"
cross_language = true
category = "performance-optimization"
tags = [ "repo", "cross-language",]
provenance = "Reference is https://github.com/mafintosh/csv-parser.git at 3629a97cc456d009686656b4df4aee860ef781fe. The expectations are a frozen capture of that reference's own observable behaviour over 13 probe(s), distilled from 5 repeated runs so that only what it reproduces every time is graded. No expected output was hand-authored."
license_path = "LICENSE.upstream"
verifier_isolation = "separate"

[metadata.upstream]
url = "https://github.com/mafintosh/csv-parser.git"
commit = "3629a97cc456d009686656b4df4aee860ef781fe"
committed_at = "2026-05-07T12:13:09Z"
license_spdx = "MIT"
license_files = [ "LICENSE",]

[verifier]
timeout_sec = 3600.0
user = "root"
environment_mode = "separate"
collect = []

[verifier.env]

[agent]
user = "65534"
timeout_sec = 14400.0

[environment]
network_mode = "no-network"
build_timeout_sec = 3600.0
os = "linux"
cpus = 8
memory_mb = 8192
storage_mb = 51200
gpus = 0
gpu_types = []
mcp_servers = []

[environment.env]

[solution.env]
