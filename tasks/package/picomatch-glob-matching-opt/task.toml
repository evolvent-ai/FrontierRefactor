schema_version = "1.4"
artifacts = [ "/app",]

[task]
name = "package/picomatch-glob-matching-opt"
description = "Blazing fast and accurate glob matcher written JavaScript, with no dependencies and full support for standard and extended Bash glob features, including braces, extglobs, POSIX brackets, and regular expressions. Used by GraphQL, Jest, Astro, Snowpack, Storybook, bulma, Serverless, fdir, Netlify, AWS Amplify, Revogrid, rollup, routify, open-wc, imba, ava, docusaurus, fast-glob, globby, chokidar, anymatch, cloudflare/miniflare, pts, and more than 5 million projects! Please follow picomatch's author: https://github.com/jonschlinkert"
authors = []
keywords = [ "package", "optimisation",]

[metadata]
scale = "package"
source_language = "javascript"
target_language = ""
cross_language = false
category = "performance-optimization"
tags = [ "package", "optimisation",]
provenance = "Reference is https://github.com/micromatch/picomatch.git at 9fab7bf61913ea334c4203ed321c426cfde44a42. The expectations are a frozen capture of that reference's own observable behaviour over 137 probe(s), distilled from 5 repeated runs so that only what it reproduces every time is graded. No expected output was hand-authored."
license_path = "LICENSE.upstream"
verifier_isolation = "separate"

[metadata.upstream]
url = "https://github.com/micromatch/picomatch.git"
commit = "9fab7bf61913ea334c4203ed321c426cfde44a42"
committed_at = "2026-08-27T19:07:52Z"
license_spdx = "MIT"
license_files = [ "LICENSE",]

[verifier]
timeout_sec = 3600.0
user = "root"
environment_mode = "separate"
collect = []

