category = "performance-optimization"
tags = [ "package", "cross-language",]
provenance = "Reference is https://github.com/majiidd/persiantools.git at f210eef512177b236e1a76a400e598e355b3378e. The expectations are a frozen capture of that reference's own observable behaviour over 63 probe(s), distilled from 5 repeated runs so that only what it reproduces every time is graded. No expected output was hand-authored."
license_path = "LICENSE.upstream"
verifier_isolation = "separate"

[metadata.upstream]
url = "https://github.com/majiidd/persiantools.git"
